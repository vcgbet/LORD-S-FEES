# Render Blueprint — FREE plan version (no persistent disk).
#
# Free-plan behaviour you should know:
#  • The app spins down after ~15 min of inactivity; the first visit after
#    that takes ~30–50 seconds to wake up.
#  • The filesystem is ephemeral: when the service is REDEPLOYED (new
#    commit, config change, or manual deploy) the database starts empty.
#    => Habit: Admin → Export → "Download Database Backup" regularly,
#       and use "Restore from Backup" after any redeploy.
#
# If you later upgrade to the paid starter plan, switch to render.yaml
# (adds a 1 GB persistent disk so data survives automatically).

services:
  - type: web
    name: lga-fees
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
