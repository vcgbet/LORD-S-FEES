# Fly.io config
# Usage:
#   fly launch --no-deploy     (then review this file)
#   fly volumes create fees_data --size 1 --region lhr
#   fly deploy
#
# lhr (London) is the region closest to Ghana.

app = "lga-fees"
primary_region = "lhr"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "fees_data"
  destination = "/app/data"
